# Development-only builder probe. No kernel, ESP, signing or appliance boot.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
RepositoryKeyCheck=yes
RepositoryKeyFetch=no
Mirror=https://snapshot.debian.org/archive/debian/20261018T000000Z/

[Output]
Format=tar
CompressOutput=no
Output=firearc-root-smoke
ImageId=firearc-build-smoke
ImageVersion=0.1.0-dev
ManifestFormat=json

[Content]
Packages=systemd=257.13-1~deb13u1
Bootable=no
WithDocs=no
WithRecommends=no
CleanPackageMetadata=no
SourceDateEpoch=1792281600
Autologin=no
Ssh=no
RootPassword=hashed:!
Locale=C.UTF-8
Timezone=UTC
Hostname=firearc-smoke
RemoveFiles=etc/apt/sources.list
RemoveFiles=etc/apt/sources.list.d/*.sources
RemoveFiles=var/cache/ldconfig/aux-cache
RemoveFiles=var/log/alternatives.log

[Validation]
# An unsigned build-stage tar is not a bootable/releasable security bypass.
SecureBoot=no
SecureBootAutoEnroll=no

[Build]
Incremental=no
WithNetwork=no
UseSubvolumes=no
RepartOffline=yes
History=no
