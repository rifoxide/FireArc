# Freeze the project root tar into an offline filesystem payload.
# This staging GPT is NOT the installed A/B disk layout and has no ESP.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
RepositoryKeyCheck=yes
RepositoryKeyFetch=no

[Output]
Format=disk
Output=firearc-root-payload
CompressOutput=no
SplitArtifacts=partitions
RepartDirectories=repart.d
Seed=5109c42f-52fa-5b1f-90f4-c582519ea3f6

[Content]
Bootable=no
WithDocs=no
WithRecommends=no
CleanPackageMetadata=no
SourceDateEpoch=1792281600

[Validation]
SecureBoot=no
SecureBootAutoEnroll=no
Verity=no

[Build]
# Public immutable filesystem metadata, not a device identity or secret.
Environment="SYSTEMD_REPART_MKFS_OPTIONS_EXT4=-E hash_seed=5109c42f-52fa-5b1f-90f4-c582519ea3f6,lazy_itable_init=0,lazy_journal_init=0"
Incremental=no
WithNetwork=no
UseSubvolumes=no
RepartOffline=yes
History=no
