# Unsigned preassembly root stage. Never boot/provision this tar directly.
# Packages are supplied from locks/root.json by the build pipeline.
[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
RepositoryKeyCheck=yes
RepositoryKeyFetch=no
Mirror=https://snapshot.debian.org/archive/debian/20261018T000000Z/

[Output]
Format=tar
CompressOutput=no
Output=firearc-root
ImageId=firearc-root
ImageVersion=0.1.0-dev
ManifestFormat=json

[Content]
Bootable=no
WithDocs=no
WithRecommends=no
CleanPackageMetadata=no
SourceDateEpoch=1792281600
Autologin=no
Ssh=no
RootPassword=hashed:!
Locale=C.UTF-8
Timezone=UTC
Hostname=firearc
FinalizeScripts=finalize.sh
SkeletonTrees=skeleton
RemoveFiles=etc/apt/sources.list
RemoveFiles=etc/apt/sources.list.d/*.sources
RemoveFiles=var/cache/ldconfig/aux-cache
RemoveFiles=var/log/alternatives.log

[Validation]
SecureBoot=no
SecureBootAutoEnroll=no

[Build]
Incremental=no
WithNetwork=no
UseSubvolumes=no
RepartOffline=yes
History=no
