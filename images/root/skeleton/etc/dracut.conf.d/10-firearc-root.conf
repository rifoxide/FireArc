# Q35 image with the project-owned root gate. No authority is present until
# slot-specific UKI assembly; a direct boot of this stage must fail closed.
hostonly="no"
hostonly_cmdline="no"
reproducible="yes"
compress="gzip"
add_dracutmodules+=" systemd systemd-initrd dm firearc-root tpm2-tss "
add_drivers+=" virtio_pci virtio_blk virtio_scsi sd_mod dm_mod dm_verity dm_crypt ext4 tpm_tis tpm_crb "
kernel_cmdline="rd.shell=0 rd.emergency=poweroff"
omit_dracutmodules+=" rescue overlay-root overlayfs rootfs-block dracut-systemd systemd-emergency debug crypt systemd-cryptsetup systemd-veritysetup "
# Root is unencrypted. Data unlock is a later explicit policy, never an automatic
# crypttab/rootfs-block path or interactive prompt in this integrity-only initrd.
# Full preverification will use this tool, not just systemd's lazy mapping.
install_items+=" /usr/sbin/veritysetup "
# Explicit TPM2 data tools (Phase 5 items 8+): the enrollment, crypttab-unlock
# and /data-mount units need these exact files inside the initrd; the crypt
# and systemd-cryptsetup dracut MODULES stay omitted — no dracut-generated
# automatic unlock path exists. Item 9 supplies the supported crypttab
# configuration (etc/crypttab rides in the UKI's appended cpio) which the
# systemd-cryptsetup generator turns into a unit that only OUR gate starts
# (noauto): unlock stays ordered after the root gate and the measured initrd
# phase. Item 10 needs mkfs.ext4 for the one-shot filesystem birth at
# enrollment; dd is needed by the enrollment unit (the minimal initrd ships
# cat/od but neither dd nor head/tail; binary-exact credential transport
# needs dd).
install_items+=" /usr/bin/systemd-cryptenroll /usr/bin/systemd-cryptsetup /usr/lib/x86_64-linux-gnu/cryptsetup/libcryptsetup-token-systemd-tpm2.so /usr/bin/dd /usr/sbin/cryptsetup /usr/sbin/mkfs.ext4 /usr/lib/systemd/system-generators/systemd-cryptsetup-generator "
