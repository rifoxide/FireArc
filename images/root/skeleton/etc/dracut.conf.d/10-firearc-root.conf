# Q35 image with the project-owned root gate. No authority is present until
# slot-specific UKI assembly; a direct boot of this stage must fail closed.
hostonly="no"
hostonly_cmdline="no"
reproducible="yes"
compress="gzip"
add_dracutmodules+=" systemd systemd-initrd dm firearc-root tpm2-tss "
add_drivers+=" virtio_pci virtio_blk virtio_scsi sd_mod dm_mod dm_verity dm_crypt ext4 tpm_tis tpm_crb "
kernel_cmdline="rd.shell=0 rd.emergency=poweroff"
omit_dracutmodules+=" rescue overlay-root overlayfs rootfs-block dracut-systemd systemd-emergency debug crypt systemd-cryptsetup systemd-veritysetup "
# Root is unencrypted. Data unlock is a later explicit policy, never an automatic
# crypttab/rootfs-block path or interactive prompt in this integrity-only initrd.
# Full preverification will use this tool, not just systemd's lazy mapping.
install_items+=" /usr/sbin/veritysetup "
